<!doctype html>
<html lang="id" data-theme="dark" data-style="default"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Zippy Sistem Center — Swipe. Play. Repeat.</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/themes.css?v=2.9.0">
<style>
/* ============================================================
   Zippy Sistem Center v2.9.0 — Mudah Dikontrol, Tanpa Login
   Tagline: Swipe. Play. Repeat.
   ============================================================ */
:root{
  --bg:#f4f8ff;--sf:#ffffff;--sf2:#e6efff;--ln:#e0e8f6;--tx:#0b1b46;--mu:#5b6b8c;
  --ac:#2563eb;--ac2:#60a5fa;--on:#ffffff;--nav:#ffffff;--page:var(--bg);
  --dng:#ef4444;--gold:#f59e0b;--heart:#ff3b5c;--ok:#16a34a;
  --fnt:'Plus Jakarta Sans',Roboto,system-ui,-apple-system,sans-serif;
}
[data-theme=dark]{
  --bg:#0a1430;--sf:#111f45;--sf2:#1b2d5e;--ln:#22356b;--tx:#eef3ff;--mu:#93a4d0;
  --ac:#3b82f6;--ac2:#60a5fa;--nav:#0d1938;--page:var(--bg);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{
  position:static!important;
  width:100%;
  height:auto!important;
  min-height:100%;
  overflow-x:hidden!important;
  overflow-y:scroll!important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:auto!important;
}
body{
  position:relative!important;
  width:100%;
  height:auto!important;
  min-height:100dvh;
  overflow:visible!important;
  background:var(--page)!important;
  color:var(--tx);
  font:15px/1.45 var(--fnt);
  touch-action:pan-y!important;
  overscroll-behavior-y:auto!important;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;pointer-events:none}
input,textarea,select{
  font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);
  border-radius:14px;padding:11px 14px;width:100%;outline:0;transition:border-color .2s,box-shadow .2s;resize:vertical;
}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
label{display:block;color:var(--mu);font-size:13px;font-weight:600}
a{color:inherit}
h1,h2,h3,h4{letter-spacing:-.02em;font-weight:800;color:var(--tx)}
.mu{color:var(--mu)}
.col{display:grid;gap:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px 18px;border-radius:16px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;
  font-weight:800;font-size:14px;box-shadow:0 10px 24px -10px color-mix(in srgb,var(--ac) 70%,transparent);
}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .d{fill:currentColor;fill-opacity:.17;stroke:none}
.ic.f .d{fill-opacity:1}.ic.f{stroke-width:1.6}
.ic.s{width:15px;height:15px;vertical-align:-2.5px}
.ic.b3{stroke-width:2.8}
.logo{display:block;filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--ac) 40%,transparent))}

/* ---------- Dasbor Sistem ---------- */
.adm-shell{min-height:100dvh;padding-bottom:80px}
.adm-nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--ln);padding:12px 16px}
.adm-nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.adm-brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.adm-brand h1{font-size:18.5px;display:flex;align-items:center;gap:8px}
.adm-tagline{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,var(--sf2));color:var(--ac)}
.adm-status{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--ok) 16%,var(--sf2));color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.adm-status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.adm-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.adm-pill{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-weight:700;font-size:12.5px;color:var(--tx);text-decoration:none;cursor:pointer}
.adm-pill:active{background:var(--sf2)}
.adm-pill.ac{background:var(--ac);color:#fff;border-color:transparent}

.adm-wrap{max-width:1100px;margin:0 auto;padding:16px 14px 60px}

/* ---------- Panel Kontrol Cepat Satu Klik ---------- */
.quick-bar{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 14%,var(--sf)),var(--sf));border:1.5px solid color-mix(in srgb,var(--ac) 32%,var(--ln));border-radius:20px;padding:14px 16px;margin-bottom:14px;display:grid;gap:10px}
.quick-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.quick-top h2{font-size:15.5px;display:flex;align-items:center;gap:7px}
.quick-btns{display:flex;gap:8px;flex-wrap:wrap}
.qbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);font-weight:700;font-size:12.5px;color:var(--tx);cursor:pointer;transition:border-color .15s,background .15s}
.qbtn:hover{border-color:var(--ac)}
.qbtn.pri{background:var(--ac);color:#fff;border-color:transparent}
.qbtn.ok{background:color-mix(in srgb,var(--ok) 15%,var(--bg));color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--ln))}
.qbtn.warn{background:color-mix(in srgb,var(--gold) 15%,var(--bg));color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,var(--ln))}

.adm-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.adm-stat{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;transition:transform .15s,border-color .2s}
.adm-stat:hover,.adm-stat.active{border-color:var(--ac);box-shadow:0 6px 18px -8px color-mix(in srgb,var(--ac) 45%,transparent)}
.adm-stat-ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--ac) 14%,var(--sf2));color:var(--ac);display:grid;place-items:center;flex:none}
.adm-stat-ic.dng{background:#ef444422;color:var(--dng)}
.adm-stat-ic.warn{background:#f59e0b22;color:var(--gold)}
.adm-stat-ic.ok{background:#16a34a22;color:var(--ok)}
.adm-stat b{display:block;font-size:19px;line-height:1.15;color:var(--tx)}
.adm-stat span{font-size:11.5px;color:var(--mu);font-weight:600}

.adm-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.adm-tabs::-webkit-scrollbar{display:none}
.adm-tabs button{padding:10px 15px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-weight:700;font-size:13px;color:var(--tx);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.adm-tabs button.on{background:var(--ac);color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--ac) 75%,transparent)}
.adm-tabs .bdg{padding:1px 7px;border-radius:99px;font-size:11px;font-weight:800;background:#ef4444;color:#fff;font-style:normal}

.adm-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.adm-search{flex:1;min-width:210px;display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:0 14px;color:var(--mu)}
.adm-search input{border:0!important;background:none!important;padding:11px 0!important;box-shadow:none!important;width:100%}
.adm-filters{display:flex;gap:6px;flex-wrap:wrap}
.adm-flt{padding:8px 13px;border-radius:999px;background:var(--sf);border:1px solid var(--ln);font-size:12.5px;font-weight:700;color:var(--mu);cursor:pointer}
.adm-flt.on{background:color-mix(in srgb,var(--ac) 16%,var(--sf));color:var(--ac);border-color:var(--ac)}

.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:0}.row.sp{justify-content:space-between}
.av{width:44px;height:44px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none;border:2px solid var(--ln)}.av img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 10px;border-radius:99px;background:var(--sf2);font-weight:700}
.tag.p{background:#f59e0b26;color:#f59e0b}.tag.a{background:#16a34a26;color:#16a34a}.tag.r{background:#ef444426;color:#ef4444}.tag.b{background:#3b82f626;color:#3b82f6}
.abtn{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:8px 13px;background:var(--ac);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer}
.abtn:disabled{opacity:.5;pointer-events:none}
.abtn.g{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}.abtn.no{background:var(--dng);color:#fff}.abtn.ok{background:var(--ok);color:#fff}.abtn.wn{background:#f59e0b;color:#000}
.rbox{background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:14px;display:grid;gap:10px}
.rmedia{max-width:250px;max-height:330px;border-radius:14px;overflow:hidden;background:#000;display:block}
.act-box{background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;display:none;gap:8px;margin-top:2px}
.act-box.open{display:grid}

.vgrid-adm{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.vcard-adm{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px;display:grid;gap:10px;align-content:space-between}
.vcard-adm video,.vcard-adm img{width:100%;height:230px;object-fit:contain;border-radius:14px;background:#000}

/* ---------- Panel Deteksi Pedoman & Banding ---------- */
.mod-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 16%,var(--sf)),var(--sf));border:1.5px solid color-mix(in srgb,var(--ac) 35%,var(--ln));border-radius:22px;padding:16px;margin-bottom:14px;display:grid;gap:14px}
.mod-sum-pills{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.mod-s-pill{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.mod-s-pill:hover{border-color:var(--ac)}
.mod-s-pill b{font-size:18px;font-weight:800}
.mod-s-pill small{font-size:11.5px;color:var(--mu);font-weight:700}

.mod-card{background:var(--sf);border:1.5px solid var(--ln);border-radius:20px;padding:15px;margin-bottom:12px;display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start}
.mod-card.lv-violation{border-color:#ef444488;background:color-mix(in srgb,#ef4444 5%,var(--sf))}
.mod-card.lv-warning{border-color:#f59e0b88;background:color-mix(in srgb,#f59e0b 4%,var(--sf))}
.mod-card.lv-blocked{border-color:#ef4444;opacity:.96}
.mod-vid-box{width:100%;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:9/14;position:relative}
.mod-vid-box video{width:100%;height:100%;object-fit:contain;display:block}
.mod-info{display:grid;gap:10px;min-width:0}

.appeal-banner{background:color-mix(in srgb,var(--gold) 14%,var(--bg));border:1.5px solid color-mix(in srgb,var(--gold) 55%,var(--ln));border-radius:14px;padding:12px;display:grid;gap:8px}
.appeal-banner b{color:var(--gold);display:flex;align-items:center;gap:6px;font-size:13.5px}

.risk-wrap{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;display:grid;gap:6px}
.risk-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:800}
.risk-bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden}
.risk-bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.mod-reasons{margin:0;padding-left:18px;font-size:12.5px;color:var(--tx);display:grid;gap:4px}
.mod-reasons li{line-height:1.4}
.mod-cats{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:640px){
  .mod-card{grid-template-columns:1fr}
  .mod-vid-box{max-height:230px;aspect-ratio:16/10}
  .adm-stats{grid-template-columns:repeat(2,1fr)}
}

#toast-adm{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;box-shadow:0 10px 28px #0006;display:none;z-index:999;max-width:92vw;text-align:center}

[data-style=glass] :is(.adm-stat,.card,.vcard-adm,.mod-card,.mod-hero,.quick-bar,.adm-pill,.adm-tabs button,.adm-search,.adm-flt){-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--ln);box-shadow:inset 0 1px 0 #ffffff44,0 10px 28px -14px #0007}
[data-style=brutal] :is(.card,.vcard-adm,.mod-card,.mod-hero,.quick-bar,.adm-stat,.adm-pill,.adm-tabs button,.rbox,.act-box,.abtn,.adm-search,.adm-flt){border:2.5px solid var(--ln)!important;box-shadow:var(--sh)!important;border-radius:12px!important}
[data-style=brutal] .adm-tabs button.on{background:var(--ac2);color:#000}

/* ---------- Analisis visual ---------- */
.vz-box{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--ln);margin:8px 0 10px}
.vz-box small{display:block;color:var(--mu);font-size:12px;margin-top:6px;line-height:1.45}
.vz-box .risk-bar{margin:6px 0 0}
.vz-ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--sf2);color:var(--mu)}
.vz-none b{font-size:13px}.vz-none small{margin-top:2px}
.vz-hash{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--dng)}
.vz-warn{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--dng);font-weight:600;margin:2px 0}
.mod-clean{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}.mod-clean .ic{color:var(--ok)}
.act-box select{width:100%}
</style></head><body data-view="app">

<!-- DASBOR UTAMA SISTEM (TANPA LOGIN, MUDAH DIKONTROL) -->
<div class="adm-shell" id="adm-app">
  <header class="adm-nav">
    <div class="adm-nav-in">
      <div class="adm-brand">
        <h1 id="adm-title"></h1>
        <span class="adm-tagline">Swipe. Play. Repeat.</span>
        <span class="adm-status"><i></i> <span id="info">Sistem Aktif</span></span>
      </div>
      <div class="adm-actions">
        <button type="button" class="adm-pill" id="adm-th-btn" title="Ganti Mode Terang/Gelap"></button>
        <button type="button" class="adm-pill" id="adm-st-btn" title="Ganti Gaya Tema"></button>
        <button type="button" class="adm-pill" id="adm-ref-btn"></button>
        <a href="index.html" class="adm-pill ac" id="adm-back"></a>
      </div>
    </div>
  </header>

  <main class="adm-wrap">
    <!-- PANEL KONTROL CEPAT SATU KLIK -->
    <section class="quick-bar" id="quick-bar">
      <div class="quick-top">
        <h2><span id="qc-ic"></span> Kontrol Cepat Sistem</h2>
        <small class="mu">Kelola moderasi, banding takedown, akun, dan siaran dengan 1 klik</small>
      </div>
      <div class="quick-btns" id="quick-btns"></div>
      <div class="act-box" id="quick-bc-box">
        <b>Siaran Pengumuman Cepat Sistem Zippy</b>
        <div class="row">
          <input id="q-bc-target" value="all" placeholder="Target: 'all' atau @username" style="max-width:190px">
          <input id="q-bc-msg" placeholder="Tulis pengumuman resmi Sistem Zippy untuk pengguna..." style="flex:1">
          <button type="button" class="abtn" id="q-bc-send"></button>
        </div>
      </div>
    </section>

    <div class="adm-stats" id="stats"></div>

    <div class="adm-tabs" id="adm-tabs">
      <button type="button" data-t="moderation" class="on" id="tb-mod"></button>
      <button type="button" data-t="appeals" id="tb-appeals"></button>
      <button type="button" data-t="users" id="tb-users"></button>
      <button type="button" data-t="videos" id="tb-videos"></button>
      <button type="button" data-t="reports" id="tb-reports"></button>
      <button type="button" data-t="verif" id="tb-verif"></button>
      <button type="button" data-t="stories" id="tb-stories"></button>
      <button type="button" data-t="broadcast" id="tb-broadcast"></button>
    </div>

    <div id="box"></div>
  </main>
</div>

<div id="toast-adm"></div>

<script src="config.js?v=2.9.0"></script>
<script src="js/icons.js?v=2.9.0"></script>
<script>
let SERVER = (localStorage.getItem('kserver') || window.ZIPPY_SERVER || window.KILAS_SERVER || '').replace(/\/+$/, '');
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

/* ---------- Tema Sinkron dengan Aplikasi ---------- */
let S = { theme: 'auto', style: 'default', ...JSON.parse(localStorage.ks || '{}') };
function applyTheme() {
  const dark = S.theme === 'dark' || (S.theme === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.style = S.style || 'default';
  const thBtn = $('#adm-th-btn'), stBtn = $('#adm-st-btn');
  if (thBtn) thBtn.innerHTML = `${ic(dark ? 'moon' : 'sun', 's')} <span>${dark ? 'Gelap' : 'Terang'}</span>`;
  const stNames = { default: 'Standar', glass: 'Glass', brutal: 'Brutal' };
  if (stBtn) stBtn.innerHTML = `${ic('palette', 's')} <span>${stNames[S.style] || 'Standar'}</span>`;
}
applyTheme();

$('#adm-th-btn').onclick = () => {
  const curDark = document.documentElement.dataset.theme === 'dark';
  S.theme = curDark ? 'light' : 'dark';
  try { localStorage.ks = JSON.stringify(S) } catch {}
  applyTheme();
};
$('#adm-st-btn').onclick = () => {
  const order = ['default', 'glass', 'brutal'];
  S.style = order[(order.indexOf(S.style) + 1) % order.length];
  try { localStorage.ks = JSON.stringify(S) } catch {}
  applyTheme();
};

/* ---------- Inisialisasi Ikon SVG ---------- */
$('#adm-title').innerHTML = `${logo(28)} <span>Zippy <b>Sistem Center</b></span>`;
$('#adm-ref-btn').innerHTML = `${ic('refresh', 's')} <span>Segarkan</span>`;
$('#adm-back').innerHTML = `${ic('home', 's')} <span>Buka Beranda Zippy</span>`;
$('#qc-ic').innerHTML = ic('spark', 's');
$('#q-bc-send').innerHTML = `${ic('send', 's')} Kirim`;

$('#tb-mod').innerHTML = `${ic('shield', 's')} <span>Deteksi Pedoman</span>`;
$('#tb-appeals').innerHTML = `${ic('flag', 's')} <span>Banding Takedown</span>`;
$('#tb-users').innerHTML = `${ic('users', 's')} <span>Kelola Akun</span>`;
$('#tb-videos').innerHTML = `${ic('video', 's')} <span>Kelola Video</span>`;
$('#tb-reports').innerHTML = `${ic('alert', 's')} <span>Laporan Masuk</span>`;
$('#tb-verif').innerHTML = `${ic('star', 's')} <span>Centang Biru</span>`;
$('#tb-stories').innerHTML = `${ic('camera', 's')} <span>Kelola Story</span>`;
$('#tb-broadcast').innerHTML = `${ic('megaphone', 's')} <span>Siaran Global</span>`;

let tab = 'moderation', uFilter = 'all', rFilter = '', vFilter = '', modFilter = 'all', verifFilter = 'pending', appealFilter = 'pending';
let sysStats = {};

function msg(t, bad = false) {
  const el = $('#toast-adm'); el.textContent = t; el.style.background = bad ? '#ef4444' : '#16a34a'; el.style.display = 'block';
  clearTimeout(msg.t); msg.t = setTimeout(() => el.style.display = 'none', 2800);
}

const api = async (p, o = {}) => {
  const headers = { 'Content-Type': 'application/json' };
  let r;
  try {
    r = await fetch(SERVER + '/api/sistem' + p, {
      ...o,
      headers,
      body: o.json ? JSON.stringify(o.json) : undefined
    });
  } catch {
    throw new Error('Tidak dapat terhubung ke server Zippy' + (SERVER ? ' (' + SERVER + ')' : ''));
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(d.error || 'Gagal memuat data sistem (Status ' + r.status + ')');
    err.status = r.status;
    throw err;
  }

};

function calcAgeFromBirthDate(bd) {
  if (!bd || !/^\d{4}-\d{2}-\d{2}$/.test(bd)) return '';
  const [y, m, d] = bd.split('-').map(Number);
  const now = new Date();
  let age = now.getFullYear() - y;
  const md = (now.getMonth() + 1) - m;
  if (md < 0 || (md === 0 && now.getDate() < d)) age--;
  return `${bd} (${age} thn)`;
}

const LOCAL_MOD_RULES = [
  ['Judi Online & Spam', 65, ['slot', 'gacor', 'maxwin', 'pragmatic', 'judol', 'judi', 'togel', 'casino', 'pinjol', 'dana kaget', 'rtp']],
  ['Konten Dewasa (NSFW)', 70, ['bokep', 'porn', 'nsfw', 'bugil', 'telanjang', '18+', 'open bo', 'vcs', 'hentai', 'mesum', 'syur']],
  ['Kekerasan & Berbahaya', 75, ['bunuh', 'darah', 'sadis', 'gore', 'bom', 'teroris', 'tawuran', 'celurit', 'suicide', 'lukai diri']],
  ['Ujaran Kebencian', 55, ['rasis', 'anjing lo', 'goblok lo', 'tolol lo', 'doxing', 'ancaman', 'pelecehan', 'fitnah']],
  ['Hoaks & Hak Cipta', 40, ['hoaks', 'hoax', 'bajakan', 'full movie', 'scam']]
];
function clientAnalyzeVideo(v) {
  if (v && v.mod) return v.mod;
  const txt = ` ${v.caption || ''} ${v.audio_title || ''} `.toLowerCase();
  let score = 0; const categories = [], reasons = [];
  for (const [label, w, words] of LOCAL_MOD_RULES) {
    const hits = words.filter(k => txt.includes(k));
    if (hits.length) {
      score += w;
      categories.push(label);
      reasons.push(`Terdeteksi kata kunci [${label}]: "${hits.join(', ')}"`);
    }
  }
  score = Math.min(100, score);
  const level = score >= 60 ? 'violation' : score >= 25 ? 'warning' : 'safe';
  return { score, level, mod_status: v.mod_status || 'auto', categories, reasons };
}

function modBadgeHTML(mod, appeal = null) {
  const apBadge = appeal && appeal.status === 'pending'

  if (mod.mod_status === 'blocked') return `${apBadge}<span class="tag r">${ic('ban', 's')} Ditakedown (${mod.score}%)</span>`;
  if (mod.level === 'violation') return `${apBadge}<span class="tag r">${ic('alert', 's')} Melanggar Pedoman (${mod.score}%)</span>`;
  if (mod.level === 'warning') return `${apBadge}<span class="tag p">${ic('alert', 's')} Perlu Ditinjau (${mod.score}%)</span>`;

async function fetchModerationData(flt = modFilter, q = '') {
  try {
    return await api(`/moderation?filter=${encodeURIComponent(flt)}&q=${encodeURIComponent(q)}`);
  } catch (e) {
    const vd = await api(`/videos?q=${encodeURIComponent(q)}`);
    const analyzed = (vd.videos || []).map(v => ({ ...v, mod: clientAnalyzeVideo(v) }));
    return {
      summary: {
        total: analyzed.length,
        violation: analyzed.filter(x => x.mod.level === 'violation').length,
        warning: analyzed.filter(x => x.mod.level === 'warning').length,
        blocked: analyzed.filter(x => x.mod.mod_status === 'blocked').length,
        appealed: analyzed.filter(x => x.appeal && x.appeal.status === 'pending').length,
        safe: analyzed.filter(x => x.mod.level === 'safe').length
      },
      customWords: [],
      autoBlockScore: 85,
      categories: LOCAL_MOD_RULES.map(r => ({ label: r[0] })),
      videos: analyzed
    };
  }
}

                ? `<button class="abtn ok" data-mod-act="unblock" data-id="${v.id}" data-u="${esc(v.username)}" title="Pulihkan ke Publik">${ic('check', 's')} Pulihkan</button>`
                : `<button class="abtn wn" data-mod-act="block" data-id="${v.id}" data-u="${esc(v.username)}" title="Takedown Video">${ic('ban', 's')} Takedown</button>`}
              <button class="abtn no" data-delv="${v.id}" title="Hapus Permanen">${ic('trash', 's')}</button>
            </div>
          </div>
        </div>`;
        }).join('') || '<div class="card" style="grid-column:1/-1"><p class="mu">Belum ada video yang cocok.</p></div>';
      };
      let t; $('#vq').oninput = () => { clearTimeout(t); t = setTimeout(runV, 220) };
      $('#vf-bar').onclick = e => {
        const b = e.target.closest('[data-vf]'); if (!b) return;
        vFilter = b.dataset.vf;
        $$('#vf-bar .adm-flt').forEach(x => x.classList.toggle('on', x === b));
        runV();
      };
      runV(); return;
    }

    if (tab === 'stories') {
      box.innerHTML = `<div class="adm-toolbar">
        <label class="adm-search">${ic('search', 's')}<input id="sq" placeholder="Cari teks story atau username..."></label>
      </div><div id="sl" class="vgrid-adm"></div>`;
      const runS = async () => {
        const d = await api('/stories?q=' + encodeURIComponent($('#sq').value));
        $('#sl').innerHTML = d.stories.map(s => `<div class="vcard-adm">
          <div>
            <div class="row sp" style="margin-bottom:8px">
              <div class="row">${av(s)}<div><b>@${esc(s.username)}</b><div class="mu" style="font-size:11.5px">${dt(s.created)}</div></div></div>
              <span class="tag ${s.active ? 'a' : ''}">${s.active ? 'Aktif 24j' : 'Arsip'}</span>
            </div>
            ${s.kind === 'video' ? `<video src="${sysVidUrl(s.file)}" controls preload="metadata"></video>` : `<img src="${SERVER}/uploads/${esc(s.file)}" loading="lazy">`}
            ${s.text ? `<div style="margin-top:8px;font-size:13.5px">${esc(s.text)}</div>` : ''}
            <div class="mu" style="font-size:12px;margin-top:4px">${ic('eye', 's')} ${s.views || 0} penonton</div>
          </div>
          <div class="row sp" style="padding-top:8px;border-top:1px solid var(--ln)">
            <span class="mu" style="font-size:12px">Story #${s.id}</span>
            <button class="abtn no" data-dels="${s.id}">${ic('trash', 's')} Hapus Story</button>
          </div>
        </div>`).join('') || '<div class="card" style="grid-column:1/-1"><p class="mu">Belum ada story.</p></div>';
      };
      let t; $('#sq').oninput = () => { clearTimeout(t); t = setTimeout(runS, 220) };
      runS(); return;
    }

    if (tab === 'broadcast') {
      box.innerHTML = `<div class="card">
        <h3>${ic('megaphone', 's')} Kirim Siaran / Pengumuman Resmi Sistem</h3>
        <p class="mu" style="margin-top:-6px">Kirim notifikasi pengumuman resmi dari Sistem Zippy ke seluruh pengguna aktif atau ke satu akun tertentu secara realtime.</p>
        <form id="bc-form" class="col">
          <label>Target Penerima
            <input id="bc-target" value="all" placeholder="Ketik 'all' untuk semua pengguna, atau @username tertentu" style="margin-top:6px">
          </label>
          <label>Isi Pengumuman
            <textarea id="bc-msg" rows="4" maxlength="400" placeholder="Tulis isi pengumuman resmi Sistem Zippy..." required style="margin-top:6px"></textarea>
          </label>
          <button class="btn" id="bc-btn" style="width:fit-content">${ic('send', 's')} Kirim Pengumuman Sekarang</button>
        </form>
      </div>`;
      $('#bc-form').onsubmit = async e => {
        e.preventDefault();
        const btn = $('#bc-btn'); btn.disabled = true;
        try {
          const r = await api('/broadcast', { method: 'POST', json: { target: $('#bc-target').value.trim(), message: $('#bc-msg').value.trim() } });
          $('#bc-msg').value = '';
          msg(`Pengumuman berhasil dikirim ke ${r.sent} pengguna`);
        } catch (err) { msg(err.message, true) }
        btn.disabled = false;
      };
      return;
    }

    if (tab === 'verif') {
      const d = await api('/verifications?status=' + encodeURIComponent(verifFilter));
      const pendingCnt = (d.items || []).filter(x => x.status === 'pending').length;
      box.innerHTML = `<div class="adm-toolbar">
        <div class="adm-filters" id="vrf-bar">
          ${[['pending', 'Menunggu Keputusan'], ['approved', 'Disetujui'], ['rejected', 'Ditolak']].map(([k, t]) => `<button type="button" class="adm-flt${verifFilter === k ? ' on' : ''}" data-vrf="${k}">${t}</button>`).join('')}
        </div>
        ${pendingCnt ? `<button type="button" class="abtn ok" id="vrf-approve-all">${ic('check', 's b3')} Setujui Semua (${pendingCnt})</button>` : ''}
      </div>` + (d.items.map(i => `<div class="card" data-id="${i.id}">
        <div class="row sp">
          <div class="row">${av(i)}<div><b>${esc(i.name || i.username)}</b><div class="mu">@${esc(i.username)} · ${i.followers} pengikut · ${i.videos} video</div></div></div>
          <span class="tag ${i.status[0]}">${i.status}</span>
        </div>
        <div>${esc(i.reason)}</div>
        ${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener noreferrer" style="color:var(--ac);font-weight:700">${esc(i.link)}</a>` : ''}
        <div class="mu">Diajukan ${dt(i.created)}${i.decided ? ' · diputuskan ' + dt(i.decided) : ''}${i.note ? ' · catatan: ' + esc(i.note) : ''}</div>
        ${i.status === 'pending' ? `<textarea rows="2" placeholder="Catatan sistem untuk pengguna (opsional, dipakai saat menolak)"></textarea><div class="row"><button class="abtn ok" data-a="approve">${ic('check', 's')} Setujui Centang Biru</button><button class="abtn no" data-a="reject">${ic('close', 's')} Tolak</button></div>` : ''}
      </div>`).join('') || '<div class="card"><p class="mu">Tidak ada pengajuan pada tab ini.</p></div>');
      $('#vrf-bar').onclick = e => {
        const b = e.target.closest('[data-vrf]'); if (!b) return;
        verifFilter = b.dataset.vrf; load();
      };
      const vrfAll = $('#vrf-approve-all');
      if (vrfAll) vrfAll.onclick = async () => {
        vrfAll.disabled = true;
        try {
          const r = await api('/verifications/bulk', { method: 'POST', json: { action: 'approve' } });
          msg(`${r.count} pengajuan centang biru disetujui`);
          enter(true);
        } catch (err) { msg(err.message, true); vrfAll.disabled = false }
      };
      return;
    }
  } catch (e) { box.innerHTML = '<div class="card"><p style="color:var(--dng)">' + esc(e.message) + '</p></div>' }
}

$('#box').onchange = async e => {
  const vp = e.target.closest('[data-vpriv]');
  if (vp) {
    try {
      await api('/videos/' + vp.dataset.vpriv + '/privacy', { method: 'PUT', json: { privacy: vp.value } });
      msg('Privasi video diperbarui ke ' + vp.value);
    } catch (err) { msg(err.message, true) }
  }
};

$('#box').onclick = async e => {
  // Tombol Terima / Tolak Banding
  const apBtn = e.target.closest('[data-ap-act]');
  if (apBtn) {
    const apid = apBtn.dataset.apid, act = apBtn.dataset.apAct;
    const apBox = apBtn.closest('[data-ap-box]'), noteInp = apBox && apBox.querySelector('.ap-note-inp');
    apBtn.disabled = true;
    try {
      await api('/appeals/' + apid, { method: 'POST', json: { action: act, note: noteInp ? noteInp.value : '' } });
      msg(act === 'approve' ? 'Banding diterima & video dipulihkan ke publik!' : 'Banding ditolak');
      await enter(true);
    } catch (err) { msg(err.message, true); apBtn.disabled = false }
    return;
  }

  const ma = e.target.closest('[data-mod-act]');
  if (ma) {
    const vid = ma.dataset.id, act = ma.dataset.modAct, u = ma.dataset.u;
    ma.disabled = true;
    try {
      await api('/moderation/videos/' + vid, { method: 'POST', json: { action: act } });
      msg(act === 'approve' ? 'Video #' + vid + ' ditandai Aman' : act === 'warn' ? 'Peringatan pedoman komunitas dikirim ke kreator' : act === 'block' ? 'Video #' + vid + ' ditakedown dari publik' : act === 'rescan' ? 'Pemindaian visual video #' + vid + ' selesai' : 'Video dipulihkan ke publik');
      await enter(true);
    } catch (err) {
      if (act === 'rescan') { msg(err.message || 'Pemindaian visual gagal', true); ma.disabled = false; return }
      if (act === 'warn' && u) {
        try { await api('/users/' + encodeURIComponent(u) + '/warn', { method: 'POST', json: { message: 'Peringatan Pedoman Komunitas: Videomu #' + vid + ' melanggar kebijakan komunitas Zippy.' } }); msg('Peringatan dikirim ke @' + u) } catch {}
      }
      await enter(true);
    }
    return;
  }
  const ow = e.target.closest('[data-open-warn]');
  if (ow) {
    const el = document.getElementById('wb-' + ow.dataset.openWarn);
    if (el) el.classList.toggle('open');
    return;
  }
  const sw = e.target.closest('[data-send-warn]');
  if (sw) {
    const u = sw.dataset.sendWarn, box = sw.closest('.act-box'), inp = box && box.querySelector('input');
    sw.disabled = true;
    try { await api('/users/' + encodeURIComponent(u) + '/warn', { method: 'POST', json: { message: inp ? inp.value : '' } }); msg('Peringatan terkirim ke @' + u); await enter(true) }
    catch (x) { msg(x.message, true); sw.disabled = false }
    return;
  }
  const opw = e.target.closest('[data-open-pw]');
  if (opw) {
    const el = document.getElementById('pb-' + opw.dataset.openPw);
    if (el) el.classList.toggle('open');
    return;
  }
  const spw = e.target.closest('[data-send-pw]');
  if (spw) {
    const u = spw.dataset.sendPw, box = spw.closest('.act-box'), inp = box && box.querySelector('input');
    spw.disabled = true;
    try { await api('/users/' + encodeURIComponent(u) + '/password', { method: 'POST', json: { password: inp ? inp.value : '' } }); msg('Sandi @' + u + ' berhasil direset'); if (box) box.classList.remove('open') }
    catch (x) { msg(x.message, true) }
    spw.disabled = false;
    return;
  }
  const ob = e.target.closest('[data-open-ban]');
  if (ob) {
    const u = ob.dataset.openBan;
    if (ob.dataset.banned === '1') {
      try { await api('/users/' + encodeURIComponent(u) + '/ban', { method: 'POST', json: { banned: false } }); msg('Banned @' + u + ' dibuka'); await enter(true) }
      catch (x) { msg(x.message, true) }
      return;
    }
    const el = document.getElementById('bb-' + u);
    if (el) el.classList.toggle('open');
    return;
  }
  const cb = e.target.closest('[data-confirm-ban]');
  if (cb) {
    const u = cb.dataset.confirmBan, box = cb.closest('.act-box'), inp = box && box.querySelector('input');
    cb.disabled = true;
    try { await api('/users/' + encodeURIComponent(u) + '/ban', { method: 'POST', json: { banned: true, reason: inp ? inp.value : '' } }); msg('Akun @' + u + ' berhasil dibanned'); await enter(true) }
    catch (x) { msg(x.message, true); cb.disabled = false }
    return;
  }
  const rb = e.target.closest('[data-ban]');
  if (rb) {
    const u = rb.dataset.ban, on = rb.dataset.on === '1';
    try { await api('/users/' + encodeURIComponent(u) + '/ban', { method: 'POST', json: { banned: on, reason: 'Melanggar pedoman komunitas Zippy' } }); msg(on ? 'Akun @' + u + ' dibanned' : 'Banned dibuka'); await enter(true) }
    catch (x) { msg(x.message, true) }
    return;
  }
  const v = e.target.closest('[data-v]');
  if (v) { try { await api('/users/' + encodeURIComponent(v.dataset.v) + '/verified', { method: 'POST', json: { on: v.dataset.on === '1' } }); msg('Status centang diperbarui'); await enter(true) } catch (x) { msg(x.message, true) } return }
  const du = e.target.closest('[data-delu]');
  if (du) { try { await api('/users/' + encodeURIComponent(du.dataset.delu), { method: 'DELETE' }); msg('Akun dihapus'); await enter(true) } catch (x) { msg(x.message, true) } return }
  const dv = e.target.closest('[data-delv]');
  if (dv) { try { await api('/videos/' + dv.dataset.delv, { method: 'DELETE' }); msg('Video dihapus'); await enter(true) } catch (x) { msg(x.message, true) } return }
  const dc = e.target.closest('[data-delc]');
  if (dc) { try { await api('/comments/' + dc.dataset.delc, { method: 'DELETE' }); msg('Komentar dihapus'); await enter(true) } catch (x) { msg(x.message, true) } return }
  const ds = e.target.closest('[data-dels]');
  if (ds) { try { await api('/stories/' + ds.dataset.dels, { method: 'DELETE' }); msg('Story dihapus'); await enter(true) } catch (x) { msg(x.message, true) } return }
  const dr = e.target.closest('[data-delr]');
  if (dr) { try { await api('/reports/' + dr.dataset.delr, { method: 'DELETE' }); msg('Laporan diselesaikan'); await enter(true) } catch (x) { msg(x.message, true) } return }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const c = b.closest('.card'); b.disabled = true;
  try { await api('/verifications/' + c.dataset.id, { method: 'POST', json: { action: b.dataset.a, note: c.querySelector('textarea').value } }); msg('Keputusan disimpan'); await enter(true) } catch (x) { msg(x.message, true); b.disabled = false }
};

enter(false);
</script></body></html>
