plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zippy.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.zippy.app"
        minSdk 23
        targetSdk 34
        versionCode 290
        versionName "2.9.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.register('syncWebAssets', Copy) {
    from '../../public'
    into 'src/main/assets/public'
}

preBuild.dependsOn syncWebAssets
